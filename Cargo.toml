[package]
name = "dreamcraft"
version = "1.0.2"
edition = "2024"
description = "A modern, Rust-powered visual web design studio"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.20"
regex = "1.12"
rusqlite = { version = "0.39.0", features = ["bundled"] }
sqlx = { version = "0.9.0", default-features = false, features = ["any", "mysql", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots"] }
suppaftp = { version = "12.1.1", default-features = false, features = ["native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rust-embed = { version = "8.7.2", features = ["compression"] }
mime_guess = "2.0.5"
webbrowser = "1.0.3"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
tempfile = "3.27.0"
grass = "0.13.4"
uuid = { version = "1.19", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
tao = { version = "0.37.0", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.0", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"


