name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - src/main.rs
      - assets/dreamcraft.ico
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamcraft-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build optimized Windows executable
        run: cargo build --release --locked

      - name: Verify release version and prepare assets
        id: release_meta
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'dreamcraft' | Select-Object -First 1).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a stable DreamCraft version, found $version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $stage = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $exeName = "DreamCraft-$version-windows-x64.exe"
          $package = Join-Path $stage 'package'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          $exePath = Join-Path $stage $exeName
          Copy-Item 'target/release/dreamcraft.exe' $exePath
          $exeHash = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Copy-Item $exePath (Join-Path $package $exeName)
          "$exeHash  $exeName" | Set-Content (Join-Path $package 'SHA256SUMS.txt') -Encoding ascii
          @"
DreamCraft $version for Windows x64.

Microsoft Edge WebView2 Runtime is required.
Verify the executable with SHA256SUMS.txt.
"@ | Set-Content (Join-Path $package 'README.txt') -Encoding utf8
          $zipName = "DreamCraft-$version-windows-x64.zip"
          $zipPath = Join-Path $stage $zipName
          Compress-Archive -Path (Join-Path $package '*') -DestinationPath $zipPath -CompressionLevel Optimal
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$exeHash  $exeName", "$zipHash  $zipName") | Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_meta.outputs.version }}
          name: DreamCraft ${{ steps.release_meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          body: |
            DreamCraft ${{ steps.release_meta.outputs.version }} release.

            This package contains the optimized 64-bit Windows desktop executable. Microsoft Edge WebView2 Runtime is required.

            Verify the download with the SHA-256 value in `SHA256SUMS.txt`.
          files: |
            release-assets/DreamCraft-${{ steps.release_meta.outputs.version }}-windows-x64.exe
            release-assets/DreamCraft-${{ steps.release_meta.outputs.version }}-windows-x64.zip
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
